<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>마리오풍 점프 게임 - 복원 완료 버전</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --sky:#87ceeb;
      --ground:#6b4f2d;
      --platform:#8b6b3c;
      --platform-top:#b98a4a;
      --player-body:#2b6cb0;
      --player-face:#f1c27d;
      --enemy:#e11d48;
      --coin:#ffd54a;
      --potion:#ff7fbf;
      --hud-bg:rgba(0,0,0,0.35);
      --guide-bg: rgba(0,0,0,0.45);
      --text:#fff;
      --outline: rgba(0,0,0,0.18);
    }
    html,body{height:100%;margin:0; background:var(--sky); overflow:hidden;}
    body{ display:flex; flex-direction:column; align-items:center; font-family:system-ui, sans-serif; }
    canvas{
      background:linear-gradient(var(--sky), #bde0fe);
      border:3px solid #2a3154;
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      margin-top: 130px;
    }
    #hud{
      position:fixed; top:12px; left:50%; transform:translateX(-50%);
      display:flex; gap:18px; padding:8px 12px; background:var(--hud-bg);
      border-radius:10px; font-weight:700; z-index:50;
    }
    #gameGuide{
      position:fixed; top:60px; left:50%; transform:translateX(-50%);
      width: min(920px, 94%); background: var(--guide-bg);
      padding:10px 14px; border-radius:10px; font-size:14px;
      display:flex; gap:12px; align-items:center; justify-content:space-between; z-index:50;
    }
    .guide-left { display:flex; gap:12px; }
    .guide-item { display:flex; gap:6px; align-items:center; }
    .guide-icon { width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#111; }
    .icon-coin { background: var(--coin); }
    .icon-potion { background: var(--potion); }
    .icon-stomp { background: var(--enemy); color:#fff; }
    #restartBtn{
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      padding:15px 30px; font-size:20px; background:#1a2038; color:#fff;
      border:2px solid #fff; cursor:pointer; display:none; z-index:100;
    }
    #stageFlash {
      position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
      font-size:48px; font-weight:800; color:#fff; pointer-events:none; opacity:0; z-index:70;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="score">Score: 0</div>
    <div id="lives">❤️❤️❤️❤️</div>
    <div id="stage">Stage: 1</div>
    <div id="next">Next: 150</div>
  </div>

  <div id="gameGuide">
    <div class="guide-left">
      <div class="guide-item"><div class="guide-icon icon-coin">C</div><span>코인 +20</span></div>
      <div class="guide-item"><div class="guide-icon icon-potion">P</div><span>체력 +1</span></div>
      <div class="guide-item"><div class="guide-icon icon-stomp">S</div><span>밟기 +50</span></div>
    </div>
    <div class="guide-right">이동: ←→ / 점프: Space / 일시정지: P</div>
  </div>

  <div id="stageFlash"></div>
  <button id="restartBtn">게임 재시작</button>
  <canvas id="gameCanvas"></canvas>

  <script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const stageEl = document.getElementById('stage');
  const nextEl = document.getElementById('next');
  const stageFlash = document.getElementById('stageFlash');
  const restartBtn = document.getElementById('restartBtn');

  // --- 게임 설정 ---
  const gravity = 0.6;
  const groundHeight = 80;
  const maxFallSpeed = 14;
  let score = 0, lives = 4, stage = 1;
  let paused = false, gameOver = false;
  let spawnTimer = 0, spawnInterval = 4.0;
  const keys = {};

  function resizeCanvas() {
    canvas.width = Math.max(800, Math.floor(window.innerWidth * 0.85));
    canvas.height = Math.max(500, Math.floor(window.innerHeight * 0.65));
  }

  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'KeyP') paused = !paused;
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rectOverlap = (A, B) => A.x < B.x + B.w && A.x + A.w > B.x && A.y < B.y + B.h && A.y + A.h > B.y;

  function roundRect(ctx, x, y, w, h, r, fill) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) ctx.fill();
    ctx.stroke();
  }

  // --- 플레이어 클래스 ---
  class Player {
    constructor(x,y){
      this.x = x; this.y = y; this.w = 30; this.h = 40;
      this.vx = 0; this.vy = 0;
      this.speed = 4.5;
      this.jumpPower = 15.0; // 점프력 복원 및 상향
      this.onGround = false;
      this.invincibleUntil = 0;
      this.jumpBuffer = 0;
    }
    rect(){ return { x: this.x, y: this.y, w: this.w, h: this.h }; }
    update(dt, platforms){
      const left = keys['ArrowLeft'] || keys['KeyA'];
      const right = keys['ArrowRight'] || keys['KeyD'];
      const jump = keys['Space'] || keys['ArrowUp'];

      // 이동 처리
      this.vx = (right ? this.speed : 0) - (left ? this.speed : 0);
      if (jump) this.jumpBuffer = 0.15;
      else this.jumpBuffer = Math.max(0, this.jumpBuffer - dt);

      this.vy += gravity;
      this.vy = clamp(this.vy, -20, maxFallSpeed);

      this.prevBottom = this.y + this.h;
      this.x += this.vx * dt * 60;
      this.x = clamp(this.x, 0, canvas.width - this.w);

      this.y += this.vy * dt * 60;

      // 지면 충돌
      const groundY = canvas.height - groundHeight;
      if (this.y + this.h >= groundY) {
        this.y = groundY - this.h;
        this.vy = 0;
        this.onGround = true;
      } else {
        this.onGround = false;
      }

      // 플랫폼 충돌
      for (const p of platforms) {
        const pr = p.rect();
        if (this.x + this.w > pr.x && this.x < pr.x + pr.w) {
          if (this.vy >= 0 && this.prevBottom <= pr.y + 10 && this.y + this.h >= pr.y) {
            this.y = pr.y - this.h;
            this.vy = 0;
            this.onGround = true;
          }
        }
      }

      // 점프 실행
      if (this.jumpBuffer > 0 && this.onGround) {
        this.vy = -this.jumpPower;
        this.onGround = false;
        this.jumpBuffer = 0;
      }
    }
    draw(){
      ctx.fillStyle = Date.now() < this.invincibleUntil ? 'rgba(43,108,176,0.5)' : 'var(--player-body)';
      roundRect(ctx, this.x, this.y, this.w, this.h, 6, true);
      ctx.fillStyle = 'var(--player-face)';
      ctx.beginPath(); ctx.arc(this.x + this.w/2, this.y + 10, 6, 0, Math.PI*2); ctx.fill();
    }
  }

  // --- 기타 엔티티 ---
  class Platform {
    constructor(x,y,w,h){ this.x=x; this.y=y; this.w=w; this.h=h; }
    rect(){ return {x:this.x, y:this.y, w:this.w, h:this.h}; }
    draw(){
      ctx.fillStyle = 'var(--platform)';
      roundRect(ctx, this.x, this.y, this.w, this.h, 4, true);
    }
  }

  class Coin {
    constructor(x,y){ this.x=x; this.y=y; this.r=10; this.active=true; }
    draw(){
      if(!this.active) return;
      ctx.fillStyle = 'var(--coin)';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
    }
  }

  class Enemy {
    constructor(x,y,type){
      this.x=x; this.y=y; this.w=25; this.h=25; this.type=type;
      this.dir=1; this.speed=1.2 + (stage*0.2); this.active=true;
    }
    update(dt){
      this.x += this.dir * this.speed;
      if(this.x <= 0 || this.x + this.w >= canvas.width) this.dir *= -1;
    }
    draw(){
      ctx.fillStyle = 'var(--enemy)';
      roundRect(ctx, this.x, this.y, this.w, this.h, 4, true);
    }
  }

  let player, platforms = [], coins = [], enemies = [], items = [];

  function initGame(){
    resizeCanvas();
    player = new Player(100, canvas.height - 150);
    score = 0; lives = 4; stage = 1;
    gameOver = false; paused = false;
    restartBtn.style.display = 'none';
    setupStage();
    updateHUD();
  }

  function setupStage(){
    platforms = [
      new Platform(200, canvas.height - 160, 150, 20),
      new Platform(450, canvas.height - 240, 150, 20),
      new Platform(700, canvas.height - 180, 150, 20)
    ];
    coins = [new Coin(275, canvas.height - 180), new Coin(525, canvas.height - 260)];
    enemies = [new Enemy(300, canvas.height - groundHeight - 25, 'walker')];
  }

  function updateHUD(){
    scoreEl.textContent = `Score: ${score}`;
    livesEl.textContent = '❤️'.repeat(lives);
    stageEl.textContent = `Stage: ${stage}`;
    nextEl.textContent = `Next: ${stage * 150}`;
  }

  function spawnEnemy() {
    const x = Math.random() < 0.5 ? 20 : canvas.width - 40;
    enemies.push(new Enemy(x, canvas.height - groundHeight - 25, 'walker'));
  }

  function loop(now){
    const dt = 0.016; 
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    // 배경 그리기
    ctx.fillStyle = 'var(--ground)';
    ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);

    if (!paused && !gameOver){
      player.update(dt, platforms);
      
      // 적 스폰 로직
      spawnTimer += dt;
      if(spawnTimer > spawnInterval) { spawnEnemy(); spawnTimer = 0; }

      // 충돌 체크 (코인)
      coins.forEach((c, i) => {
        if(c.active && rectOverlap(player.rect(), {x:c.x-10, y:c.y-10, w:20, h:20})){
          c.active = false; score += 20; updateHUD();
        }
      });

      // 충돌 체크 (적)
      enemies.forEach((e, i) => {
        if(!e.active) return;
        e.update(dt);
        if(rectOverlap(player.rect(), e)){
          if(player.vy > 0 && player.y + player.h < e.y + 15){
            e.active = false; player.vy = -10; score += 50; updateHUD();
          } else if(Date.now() > player.invincibleUntil){
            lives--; player.invincibleUntil = Date.now() + 1000;
            updateHUD();
            if(lives <= 0) { gameOver = true; restartBtn.style.display = 'block'; }
          }
        }
      });

      // 스테이지 클리어 체크
      if(score >= stage * 150){
        stage++; setupStage(); updateHUD();
        stageFlash.textContent = `Stage ${stage}`;
        stageFlash.style.opacity = 1;
        setTimeout(() => stageFlash.style.opacity = 0, 1000);
      }
    }

    // 그리기
    platforms.forEach(p => p.draw());
    coins.forEach(c => c.draw());
    enemies.forEach(e => { if(e.active) e.draw(); });
    player.draw();

    if(paused) { ctx.fillStyle = "#fff"; ctx.fillText("PAUSED", canvas.width/2-30, canvas.height/2); }
    if(gameOver) { ctx.fillStyle = "#fff"; ctx.fillText("GAME OVER", canvas.width/2-40, canvas.height/2); }

    requestAnimationFrame(loop);
  }

  restartBtn.addEventListener('click', initGame);
  initGame();
  loop();
  </script>
</body>
</html>
