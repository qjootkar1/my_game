<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>마리오 점프 - 안전 스폰 & 지상전 버전</title>
  <style>
    :root{
      --sky:#87ceeb; --ground:#6b4f2d; --hud-bg:rgba(0,0,0,0.6); 
      --coin:#ffd54a; --potion:#ff7fbf; --enemy:#e11d48;
    }
    body {
      margin: 0; background: #1a1a1a; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, sans-serif; height: 100vh;
    }
    canvas {
      background: #87ceeb;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border-radius: 8px; border: 4px solid #333;
      display: block;
    }
    #hud {
      position: absolute; top: 40px; width: 960px;
      display: flex; justify-content: center; gap: 40px; 
      color: #fff; font-weight: bold; font-size: 20px; z-index: 100;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    #gameGuide {
      position: absolute; bottom: 30px; width: 960px;
      background: rgba(0,0,0,0.7); padding: 10px 0; border-radius: 10px;
      color: #ccc; font-size: 14px; display: flex; justify-content: space-around;
      z-index: 90; border: 1px solid rgba(255,255,255,0.1);
    }
    .g-item { display: flex; align-items: center; gap: 8px; }
    .g-box { width: 16px; height: 16px; border-radius: 3px; }
    
    #restartBtn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 40px; font-size: 22px; font-weight: bold;
      background: #e11d48; color: white; border: 3px solid white;
      border-radius: 50px; cursor: pointer; display: none; z-index: 200;
    }
    #msg {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
      font-size: 70px; font-weight: 900; color: #fff; opacity: 0; 
      transition: 0.4s; pointer-events: none; z-index: 150;
      text-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="hud">
    <div id="scoreEl">Score: 0</div>
    <div id="livesEl">❤️❤️❤️❤️</div>
    <div id="stageEl">Stage: 1</div>
  </div>

  <div id="gameGuide">
    <div class="g-item"><span class="g-box" style="background:var(--coin)"></span> 코인 +20</div>
    <div class="g-item"><span class="g-box" style="background:var(--potion)"></span> 물약(회복)</div>
    <div class="g-item">지상 적 밟기: 처치(+50)</div>
    <div>조작: 방향키 & Space / 일시정지: P</div>
  </div>

  <div id="msg">STAGE 1</div>
  <button id="restartBtn">다시 시작</button>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 960;
    canvas.height = 540;

    const FPS = 60;
    const frameDelay = 1000 / FPS;
    const GRAVITY = 0.65;
    const JUMP_POWER = 15.5;
    const MOVE_SPEED = 5.2;

    let score = 0, lives = 4, stage = 1;
    let paused = false, gameOver = false;
    let lastFrameTime = 0;

    const keys = {};
    window.onkeydown = (e) => { 
      keys[e.code] = true; 
      if(e.code === 'KeyP') paused = !paused;
      if(['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
    };
    window.onkeyup = (e) => keys[e.code] = false;

    class Player {
      constructor() { this.w = 32; this.h = 44; this.reset(); }
      reset() {
        this.x = 80; this.y = 400; this.vx = 0; this.vy = 0;
        this.onGround = false;
        // 스테이지 전환 시 안전을 위해 무적 시간 부여 (1500ms)
        this.invincible = Date.now() + 1500; 
      }
      update(platforms) {
        this.vx = (keys['ArrowRight'] || keys['KeyD'] ? MOVE_SPEED : 0) - (keys['ArrowLeft'] || keys['KeyA'] ? MOVE_SPEED : 0);
        if ((keys['Space'] || keys['ArrowUp']) && this.onGround) { this.vy = -JUMP_POWER; this.onGround = false; }

        this.vy += GRAVITY;
        this.x += this.vx; this.y += this.vy;

        if (this.x < 0) this.x = 0;
        if (this.x > canvas.width - this.w) this.x = canvas.width - this.w;
        
        const groundY = canvas.height - 60;
        if (this.y + this.h > groundY) { this.y = groundY - this.h; this.vy = 0; this.onGround = true; }

        platforms.forEach(p => {
          if (this.x + this.w > p.x && this.x < p.x + p.w) {
            if (this.vy >= 0 && this.y + this.h >= p.y && this.y + this.h <= p.y + 20) {
              this.y = p.y - this.h; this.vy = 0; this.onGround = true;
            }
          }
        });
      }
      draw() {
        if (Date.now() < this.invincible && Math.floor(Date.now()/100)%2) return;
        ctx.fillStyle = "#2b6cb0"; 
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = "#f1c27d"; ctx.beginPath(); ctx.arc(this.x+this.w/2, this.y+14, 9, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#000"; ctx.fillRect(this.x+this.w/2+2, this.y+10, 3, 3);
      }
    }

    class Enemy {
      constructor(x, y) { 
        this.x=x; this.y=y; this.w=30; this.h=30; 
        this.dir = (x > 500) ? -1 : 1; 
        this.speed = 2 + (stage * 0.3); 
        this.active = true; 
      }
      update() { 
        this.x += this.dir * this.speed; 
        if(this.x <= 0 || this.x + this.w >= canvas.width) this.dir *= -1; 
      }
      draw() { if(!this.active) return; ctx.fillStyle="#e11d48"; ctx.fillRect(this.x, this.y, this.w, this.h); }
    }

    class Item {
      constructor(x, y, type) { this.x=x; this.y=y; this.type=type; this.w=22; this.h=22; this.active=true; }
      draw() {
        if(!this.active) return;
        ctx.fillStyle = this.type==='coin' ? "#ffd54a" : "#ff7fbf";
        if(this.type==='coin') { ctx.beginPath(); ctx.arc(this.x+11, this.y+11, 11, 0, Math.PI*2); ctx.fill(); }
        else { ctx.fillRect(this.x+3, this.y, 16, 22); ctx.fillStyle="#fff"; ctx.fillRect(this.x+7, this.y+5, 8, 8); }
      }
    }

    let player = new Player();
    let platforms = [], enemies = [], items = [];

    function initStage() {
      const w = canvas.width, h = canvas.height;
      platforms = [ 
        {x: 150, y: 380, w: 200, h: 20}, 
        {x: 450, y: 280, w: 220, h: 20}, 
        {x: 700, y: 350, w: 180, h: 20},
        {x: 100, y: 200, w: 150, h: 20}
      ];
      items = [ 
        new Item(240, 350, 'coin'), new Item(500, 250, 'coin'), 
        new Item(780, 320, 'coin'), new Item(160, 170, 'coin') 
      ];
      if(lives < 4 || stage % 2 === 0) items.push(new Item(w-100, 410, 'potion'));
      
      // 적 생성 로직 수정: 플레이어 스폰 지점(x < 300)은 피해서 스폰
      enemies = [];
      let enemyCount = Math.min(1 + stage, 5);
      for(let i=0; i<enemyCount; i++) {
        let safeX = 350 + Math.random() * (w - 450); // 무조건 350 이후부터 스폰
        enemies.push(new Enemy(safeX, h - 90)); // 모든 적은 지상(바닥)에서 스폰
      }

      const m = document.getElementById('msg');
      m.innerText = `STAGE ${stage}`; m.style.opacity = 1;
      setTimeout(() => m.style.opacity = 0, 1500);
    }

    function updateUI() {
      document.getElementById('scoreEl').innerText = `Score: ${score}`;
      document.getElementById('livesEl').innerText = '❤️'.repeat(Math.max(0, lives));
      document.getElementById('stageEl').innerText = `Stage: ${stage}`;
    }

    function loop(currentTime) {
      requestAnimationFrame(loop);
      const elapsed = currentTime - lastFrameTime;
      if (elapsed < frameDelay) return;
      lastFrameTime = currentTime - (elapsed % frameDelay);

      ctx.fillStyle = "#87ceeb"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#6b4f2d"; ctx.fillRect(0, canvas.height-60, canvas.width, 60);

      if (!paused && !gameOver) {
        player.update(platforms);
        items.forEach(it => {
          if(it.active && player.x < it.x+it.w && player.x+player.w > it.x && player.y < it.y+it.h && player.y+player.h > it.y) {
            it.active = false;
            if(it.type==='coin') score += 20; else lives = Math.min(6, lives+1);
            updateUI();
            if(items.filter(i=>i.type==='coin' && i.active).length === 0) { 
              stage++; 
              player.reset(); // 무적 시간과 위치 초기화
              initStage(); 
              updateUI(); 
            }
          }
        });
        enemies.forEach(e => {
          if(!e.active) return; e.update();
          if(player.x < e.x+e.w && player.x+player.w > e.x && player.y < e.y+e.h && player.y+player.h > e.y) {
            if(player.vy > 0 && player.y + player.h < e.y + 15) { 
              e.active=false; player.vy=-12; score+=50; updateUI(); 
            } else if(Date.now() > player.invincible) {
              lives--; player.invincible = Date.now()+1000; player.vy=-8; updateUI();
              if(lives <= 0) { gameOver=true; document.getElementById('restartBtn').style.display='block'; }
            }
          }
        });
      }

      platforms.forEach(p => { 
        ctx.fillStyle="#8b6b3c"; ctx.fillRect(p.x, p.y, p.w, p.h); 
        ctx.fillStyle="#b98a4a"; ctx.fillRect(p.x, p.y, p.w, 4); 
      });
      items.forEach(i => i.draw());
      enemies.forEach(e => e.draw());
      player.draw();

      if(paused) { 
        ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(0,0,canvas.width,canvas.height); 
        ctx.fillStyle="#fff"; ctx.font="bold 30px sans-serif"; ctx.textAlign="center";
        ctx.fillText("PAUSED", canvas.width/2, canvas.height/2); 
      }
      if(gameOver) { 
        ctx.fillStyle="rgba(0,0,0,0.7)"; ctx.fillRect(0,0,canvas.width,canvas.height); 
        ctx.fillStyle="#fff"; ctx.font="bold 40px sans-serif"; ctx.textAlign="center";
        ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2); 
      }
    }

    document.getElementById('restartBtn').onclick = () => {
      score=0; lives=4; stage=1; gameOver=false; player.reset(); initStage(); updateUI(); document.getElementById('restartBtn').style.display='none';
    };

    initStage();
    updateUI();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
