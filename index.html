<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>마리오 점프 - 와이드 화면 & 60FPS 고정</title>
  <style>
    :root{
      --sky:#87ceeb; --ground:#6b4f2d; --hud-bg:rgba(0,0,0,0.5); 
      --coin:#ffd54a; --potion:#ff7fbf; --enemy:#e11d48;
    }
    body {
      margin: 0; background: #222; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      font-family: system-ui, sans-serif; height: 100vh;
    }
    /* 화면 크기에 반응하도록 설정 */
    canvas {
      background: #87ceeb;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      margin-top: 100px; border-radius: 4px; display: block;
    }
    #hud {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 20px; padding: 10px 24px;
      background: var(--hud-bg); color: #fff; font-weight: bold;
      border-radius: 30px; z-index: 100; font-size: 18px;
      backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2);
    }
    #gameGuide {
      position: fixed; top: 75px; left: 50%; transform: translateX(-50%);
      width: min(900px, 90%); background: rgba(0,0,0,0.6);
      padding: 12px 20px; border-radius: 12px; color: #eee; font-size: 14px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 90; pointer-events: none;
    }
    .guide-icons { display: flex; gap: 15px; }
    .g-item { display: flex; align-items: center; gap: 6px; }
    .g-box { width: 18px; height: 18px; border-radius: 4px; display: inline-block; }
    #restartBtn {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 35px; font-size: 24px; font-weight: bold;
      background: #e11d48; color: white; border: 4px solid white;
      border-radius: 12px; cursor: pointer; display: none; z-index: 200;
    }
    #msg {
      position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-size: 60px; font-weight: 900; color: #fff; opacity: 0; transition: 0.5s; pointer-events: none; z-index: 150;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div id="scoreEl">Score: 0</div>
    <div id="livesEl">❤️❤️❤️❤️</div>
    <div id="stageEl">Stage: 1</div>
  </div>

  <div id="gameGuide">
    <div class="guide-icons">
      <div class="g-item"><span class="g-box" style="background:var(--coin)"></span> 코인 +20</div>
      <div class="g-item"><span class="g-box" style="background:var(--potion)"></span> 회복 +1</div>
      <div class="g-item"><span class="g-box" style="background:var(--enemy)"></span> 밟기 +50</div>
    </div>
    <div>이동: ← → / 점프: Space / 일시정지: P</div>
  </div>

  <div id="msg">STAGE 1</div>
  <button id="restartBtn">다시 시작</button>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // 게임 상수 (60FPS 고정용)
    const FPS = 60;
    const frameDelay = 1000 / FPS;
    const GRAVITY = 0.6;
    const JUMP_POWER = 15.0;
    const MOVE_SPEED = 5.5;

    let score = 0, lives = 4, stage = 1;
    let paused = false, gameOver = false;
    let lastFrameTime = 0;

    const keys = {};
    window.onkeydown = (e) => { 
      keys[e.code] = true; 
      if(e.code === 'KeyP') paused = !paused;
      if(['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
    };
    window.onkeyup = (e) => keys[e.code] = false;

    // 캔버스 크기를 화면에 맞게 조절 (넓게!)
    function resizeCanvas() {
      canvas.width = Math.max(800, window.innerWidth * 0.85);
      canvas.height = Math.max(500, window.innerHeight * 0.7);
    }
    window.addEventListener('resize', () => {
      resizeCanvas();
      // 크기가 바뀔 때 바닥 위치 등을 재조정하기 위해 스테이지 초기화
      initStage(); 
    });

    class Player {
      constructor() { this.w = 30; this.h = 40; this.reset(); }
      reset() {
        this.x = 100; this.y = 300; this.vx = 0; this.vy = 0;
        this.onGround = false; this.invincible = 0;
      }
      update(platforms) {
        this.vx = (keys['ArrowRight'] || keys['KeyD'] ? MOVE_SPEED : 0) - (keys['ArrowLeft'] || keys['KeyA'] ? MOVE_SPEED : 0);
        if ((keys['Space'] || keys['ArrowUp']) && this.onGround) { this.vy = -JUMP_POWER; this.onGround = false; }

        this.vy += GRAVITY;
        this.x += this.vx; this.y += this.vy;

        if (this.x < 0) this.x = 0;
        if (this.x > canvas.width - this.w) this.x = canvas.width - this.w;
        
        const groundY = canvas.height - 60;
        if (this.y + this.h > groundY) { this.y = groundY - this.h; this.vy = 0; this.onGround = true; }

        platforms.forEach(p => {
          if (this.x + this.w > p.x && this.x < p.x + p.w) {
            if (this.vy >= 0 && this.y + this.h >= p.y && this.y + this.h <= p.y + 20) {
              this.y = p.y - this.h; this.vy = 0; this.onGround = true;
            }
          }
        });
      }
      draw() {
        if (Date.now() < this.invincible && Math.floor(Date.now()/100)%2) return;
        ctx.fillStyle = "#2b6cb0"; ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = "#f1c27d"; ctx.beginPath(); ctx.arc(this.x+15, this.y+12, 8, 0, Math.PI*2); ctx.fill();
      }
    }

    class Enemy {
      constructor(x, y) { this.x=x; this.y=y; this.w=30; this.h=30; this.dir=-1; this.speed=2+(stage*0.3); this.active=true; }
      update() { this.x += this.dir * this.speed; if(this.x<=0 || this.x+this.w>=canvas.width) this.dir *= -1; }
      draw() { if(!this.active) return; ctx.fillStyle="#e11d48"; ctx.fillRect(this.x, this.y, this.w, this.h); }
    }

    class Item {
      constructor(x, y, type) { this.x=x; this.y=y; this.type=type; this.w=20; this.h=20; this.active=true; }
      draw() {
        if(!this.active) return;
        ctx.fillStyle = this.type==='coin' ? "#ffd54a" : "#ff7fbf";
        if(this.type==='coin') { ctx.beginPath(); ctx.arc(this.x+10, this.y+10, 10, 0, Math.PI*2); ctx.fill(); }
        else { ctx.fillRect(this.x, this.y, 20, 20); }
      }
    }

    let player = new Player();
    let platforms = [], enemies = [], items = [];

    function initStage() {
      const w = canvas.width, h = canvas.height;
      platforms = [ 
        {x: w*0.15, y: h*0.7, w: 180, h: 20}, 
        {x: w*0.5, y: h*0.5, w: 200, h: 20}, 
        {x: w*0.75, y: h*0.6, w: 150, h: 20} 
      ];
      items = [ new Item(w*0.2, h*0.7-30, 'coin'), new Item(w*0.55, h*0.5-30, 'coin'), new Item(w*0.8, h*0.6-30, 'coin') ];
      if(stage % 2 === 0) items.push(new Item(w-100, h-100, 'potion'));
      enemies = [ new Enemy(w-150, h-90) ];
      if(stage > 1) enemies.push(new Enemy(w*0.3, h-90));

      document.getElementById('msg').innerText = `STAGE ${stage}`;
      document.getElementById('msg').style.opacity = 1;
      setTimeout(() => document.getElementById('msg').style.opacity = 0, 1500);
    }

    function updateUI() {
      document.getElementById('scoreEl').innerText = `Score: ${score}`;
      document.getElementById('livesEl').innerText = '❤️'.repeat(Math.max(0, lives));
      document.getElementById('stageEl').innerText = `Stage: ${stage}`;
    }

    function loop(currentTime) {
      requestAnimationFrame(loop);
      const elapsed = currentTime - lastFrameTime;
      if (elapsed < frameDelay) return;
      lastFrameTime = currentTime - (elapsed % frameDelay);

      ctx.fillStyle = "#87ceeb"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#6b4f2d"; ctx.fillRect(0, canvas.height-60, canvas.width, 60);

      if (!paused && !gameOver) {
        player.update(platforms);
        items.forEach(it => {
          if(it.active && player.x < it.x+it.w && player.x+player.w > it.x && player.y < it.y+it.h && player.y+player.h > it.y) {
            it.active = false;
            if(it.type==='coin') score += 20; else lives = Math.min(6, lives+1);
            updateUI();
            if(items.filter(i=>i.type==='coin' && i.active).length === 0) { stage++; initStage(); player.reset(); updateUI(); }
          }
        });
        enemies.forEach(e => {
          if(!e.active) return; e.update();
          if(player.x < e.x+e.w && player.x+player.w > e.x && player.y < e.y+e.h && player.y+player.h > e.y) {
            if(player.vy > 0 && player.y + player.h < e.y + 15) { e.active=false; player.vy=-12; score+=50; updateUI(); }
            else if(Date.now() > player.invincible) {
              lives--; player.invincible = Date.now()+1000; player.vy=-8; updateUI();
              if(lives <= 0) { gameOver=true; document.getElementById('restartBtn').style.display='block'; }
            }
          }
        });
      }

      platforms.forEach(p => { ctx.fillStyle="#8b6b3c"; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.fillStyle="#b98a4a"; ctx.fillRect(p.x, p.y, p.w, 5); });
      items.forEach(i => i.draw());
      enemies.forEach(e => e.draw());
      player.draw();

      if(paused) { ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle="#fff"; ctx.font="30px sans-serif"; ctx.fillText("PAUSED", canvas.width/2-50, canvas.height/2); }
      if(gameOver) { ctx.fillStyle="rgba(0,0,0,0.7)"; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle="#fff"; ctx.font="40px sans-serif"; ctx.fillText("GAME OVER", canvas.width/2-100, canvas.height/2); }
    }

    document.getElementById('restartBtn').onclick = () => {
      score=0; lives=4; stage=1; gameOver=false; player.reset(); initStage(); updateUI(); document.getElementById('restartBtn').style.display='none';
    };

    resizeCanvas();
    initStage();
    updateUI();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
